name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: comfy-conv-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: comfy-conv-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: comfy-conv-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: comfy-conv-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/comfy-conv ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/comfy-conv.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            comfy-conv-linux-x64/comfy-conv-linux-x64
            comfy-conv-macos-x64/comfy-conv-macos-x64
            comfy-conv-macos-arm64/comfy-conv-macos-arm64
            comfy-conv-windows-x64.exe/comfy-conv-windows-x64.exe
          generate_release_notes: true
